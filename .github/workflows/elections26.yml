# Not active yet: move to .github/workflows/elections26.yml once publishing on GitHub Pages is approved.
# Keeps the Knesset 26 results page on the gh-pages branch up to date.
# Plain script, no AI. One job loops for ~5h40m (fetch every 6 minutes, commit only on change),
# then dispatches its own next run, so it needs no cron on the default branch.
# It stops by itself after STOP_AFTER in elections26/update.mjs; to stop it earlier, disable the workflow.
name: elections26

on:
  push:
    branches: [claude/project-thread-qg4lbt]
    paths: [elections26/**, .github/workflows/elections26.yml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: elections26
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          path: src
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch results every 6 minutes
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            node ../src/elections26/update.mjs . || true
            cp ../src/elections26/index.html index.html
            touch .nojekyll
            git add -A
            if ! git diff --cached --quiet; then
              git commit -q -m "Update results $(date -u +%H:%M)"
              git push -q origin gh-pages || { git pull -q --rebase origin gh-pages && git push -q origin gh-pages; } || true
            fi
            if node -e "process.exit(Date.now() > Date.parse('2026-11-05T00:00:00+02:00') ? 0 : 1)"; then
              echo "past STOP_AFTER"; echo "STOPPED=1" >> "$GITHUB_ENV"; break
            fi
            sleep 360
          done
      - name: Start the next run
        if: success() && env.STOPPED != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run elections26.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
